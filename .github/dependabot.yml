version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope

  # Add per-project ecosystems below as they're introduced.
  # Examples:
  # - package-ecosystem: npm
  #   directory: "/"
  #   schedule: { interval: weekly }
  # - package-ecosystem: pip
  #   directory: "/"
  #   schedule: { interval: weekly }
