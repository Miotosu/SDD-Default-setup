name: SDD Task
description: An atomic, agent-executable task generated by the Decomposer.
title: "[Module] | [Action] | [Component]"
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Title must follow the SNC standard: `[Module] | [Action] | [Component]`
        (e.g. `[User-Auth] | LOGIC | Password Hashing`).

  - type: input
    id: spec
    attributes:
      label: Parent spec
      description: Path to the feature spec under `specs/features/`.
      placeholder: specs/features/<feature-name>.md
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Must equal `Feature: <Feature Name>` and match the parent spec.
      placeholder: "Feature: <Feature Name>"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: One paragraph from the parent spec — what slice of behavior this task delivers.
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Checklist derived from the master spec. Every item must be testable.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must be closed before this one starts (use `#N`). Leave blank if none.

  - type: dropdown
    id: stage
    attributes:
      label: SDD stage
      options:
        - Setup
        - Logic
        - Integration
        - Test
    validations:
      required: true
